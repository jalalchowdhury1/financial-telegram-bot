# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: CI

# Pre-merge gate: nothing ran on PRs before, so "CI must pass to merge" wasn't actually
# enforced. This runs the backend + dashboard test suites on every PR to main, which is
# also the gate the Phase 2 self-improve agent's PRs must clear.
on:
  pull_request:
    branches: [main]
  # Bot PRs (opened with GITHUB_TOKEN) never fire pull_request, so the required
  # checks would sit at "expected" forever. workflow_dispatch is the one event a
  # GITHUB_TOKEN may trigger, so the rebake bots dispatch CI on their own branch and
  # the `report` job below hands the result to their PR.
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest tests/ -q

  dashboard-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: npm test -- --watchAll=false
      - name: Build
        run: npm run build

  # A dispatched run's checks never reach a pull request: GitHub files them under the
  # dispatch, not the PR, so a bot PR stayed BLOCKED after its dispatched CI passed
  # (canary PR #65, 11 Oct 2026). A commit status of the same name does count (the PR
  # went BLOCKED -> mergeable), so a dispatched run copies each job's result onto the
  # commit it tested. Posting it is no new power: any write token can set a status.
  report:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [backend-tests, dashboard-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Copy the job results onto the commit as statuses
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BACKEND: ${{ needs.backend-tests.result }}
          DASHBOARD: ${{ needs.dashboard-tests.result }}
        run: |
          post() {   # context, job result (success | failure | cancelled | skipped)
            if [ "$2" = success ]; then STATE=success; else STATE=failure; fi
            for _ in 1 2 3; do
              gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -f state="$STATE" -f context="$1" \
                -f target_url="$RUN_URL" -f description="dispatched CI run: $2" >/dev/null && return 0
              sleep 10
            done
            echo "::error::could not post the $1 status"
            return 1
          }
          RC=0
          post backend-tests "$BACKEND" || RC=1
          post dashboard-tests "$DASHBOARD" || RC=1
          exit $RC
