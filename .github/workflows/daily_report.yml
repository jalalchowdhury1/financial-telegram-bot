# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: Daily Financial Report

on:
  schedule:
    # 09:45 UTC — 30 min after the EventBridge/Lambda send (~09:15), so the guard step
    # below can see the Lambda's CloudWatch marker and SKIP if it already delivered (no
    # double-report). If the Lambda missed (as on 2026-06-02), the runner sends here — a
    # reliable morning backstop that no longer depends on the flaky EventBridge schedule.
    - cron: '45 9 * * *'
  workflow_dispatch:
    inputs:
      retry_count:
        description: 'Number of retry attempts so far'
        required: false
        default: '0'
  # Allow triggering via GitHub UI or API
  repository_dispatch:
    types: [telegram-report]

jobs:
  generate-and-send-report:
    runs-on: ubuntu-latest
    permissions:
      actions: write  # Allow triggering workflow_dispatch on retry

    # Job-level env ensures every step sees these
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Verify secrets are present
        run: |
          echo "Checking for required secrets..."
          if [ -z "$FRED_API_KEY" ]; then
            echo "ERROR: FRED_API_KEY secret is not set"
            exit 1
          fi
          if [ -z "$ALPHA_VANTAGE_API_KEY" ]; then
            echo "ERROR: ALPHA_VANTAGE_API_KEY secret is not set"
            exit 1
          fi
          if [ -z "$TELEGRAM_TOKEN" ]; then
            echo "ERROR: TELEGRAM_TOKEN secret is not set"
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERROR: TELEGRAM_CHAT_ID secret is not set"
            exit 1
          fi
          echo "✓ All required secrets are present"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # On the morning cron only, skip if the Lambda already delivered today (prevents a
      # double-report). Manual / repository_dispatch / auto-remediation runs always send.
      # Fail-safe: if the CloudWatch check errors, we default to sending (a rare double is
      # better than a silent miss).
      - name: Skip if the Lambda already delivered today (scheduled runs only)
        id: guard
        if: github.event_name == 'schedule'
        run: |
          set -uo pipefail
          START_MS=$(python -c "import time;print(int((time.time()-86400)*1000))")
          MARKERS=$(aws logs filter-log-events \
            --log-group-name /aws/lambda/financial-telegram-report \
            --start-time "$START_MS" \
            --filter-pattern 'REPORT_DELIVERED' \
            --query 'events[].message' --output text 2>/dev/null || echo "")
          if [ -n "$MARKERS" ]; then
            echo "Lambda already delivered today — skipping runner send (no double-report)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Lambda delivery in the last 24h — runner will send the report."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate and send financial report
        id: report
        if: steps.guard.outputs.skip != 'true'
        run: python -m bot.main report
        continue-on-error: true

      - name: Retry on failure
        if: steps.report.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RETRY_COUNT: ${{ github.event.inputs.retry_count || '0' }}
          MAX_RETRIES: 3  # 3 retries × 10 min = 30 min max
        run: |
          CURRENT_RETRY=$((RETRY_COUNT))
          NEXT_RETRY=$((CURRENT_RETRY + 1))

          echo "Report generation failed on attempt $((CURRENT_RETRY + 1))"

          if [ $CURRENT_RETRY -lt $MAX_RETRIES ]; then
            echo "Scheduling retry $NEXT_RETRY in 10 minutes..."
            sleep 600  # 10 minutes = 600 seconds

            echo "Triggering retry attempt $NEXT_RETRY via GitHub API..."
            curl -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/${{ github.repository }}/actions/workflows/daily_report.yml/dispatches \
              -d "{\"ref\":\"${{ github.ref_name }}\",\"inputs\":{\"retry_count\":\"$NEXT_RETRY\"}}"

            echo "Retry scheduled successfully"
          else
            echo "Max retries ($MAX_RETRIES) reached. Giving up."
            exit 1
          fi

      - name: Mark as failed if report generation failed
        if: steps.report.outcome == 'failure'
        run: exit 1


