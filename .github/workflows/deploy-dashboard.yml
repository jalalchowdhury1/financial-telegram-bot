# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: Deploy dashboard

# Why this exists (10 Oct 2026): Vercel's free plan allows 100 deploys a day for ALL of
# Jalal's projects together, and that day the cap was hit (151 in 24 h). Vercel used to
# deploy this repo on EVERY push, though its root is dashboard/: 14 of 33 deploys that
# day changed only bot/Lambda code. A skipped "Ignored Build Step" still counts as a
# deploy, so git auto-deploy is OFF (dashboard/vercel.json: git.deploymentEnabled false)
# and this workflow deploys only when dashboard/ changed, through a Vercel deploy hook
# (secret VERCEL_DEPLOY_HOOK, project financial-telegram-bot, ref main).
#
# - Bursts: a newer run cancels a waiting older one, and the hook always builds the newest
#   commit on main, so several pushes inside 90 s cost ONE deploy.
# - Bot merges: a push made with GITHUB_TOKEN (rebake-bankruptcies' and rebake-long-history's
#   self-merges) does not start push workflows, so a successful rebake run deploys through
#   workflow_run.
# - Manual: Actions → Deploy dashboard → Run workflow.

on:
  push:
    branches: [main]
    # Tests and the offline bake scripts never reach the site: a push of only those costs
    # no deploy (their output files, in public/ and lib/data/, still deploy).
    paths:
      - 'dashboard/**'
      - '!dashboard/scripts/**'
      - '!dashboard/**/__tests__/**'
  workflow_run:
    workflows: ['Rebake Bankruptcies History', 'Rebake Long History']
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    # A rebake run deploys only when it shipped something: never its pull_request dry run,
    # nor a dry run on another branch, nor a green run that merged nothing (nothing new).
    # For a workflow_run, github.sha is main's newest commit when the rebake finished, so it
    # differs from the rebake's head_sha only when main moved during the run: the rebake's
    # own merge or, rarely, someone else's push (then one deploy too many).
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_branch == 'main' && github.sha != github.event.workflow_run.head_sha)
    # On the job, not the workflow: a workflow-level group is taken before `if` runs, so a
    # run that deploys nothing used to cancel a push's deploy waiting out its 90 s.
    concurrency:
      group: deploy-dashboard
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Wait 90 s so a burst of pushes becomes one deploy
        if: github.event_name == 'push'
        run: sleep 90

      # The release gate: a red suite stops here and the hook never fires (same as ci.yml's
      # dashboard-tests job). After the wait, so a cancelled burst run costs no test time.
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      - name: Run dashboard tests
        working-directory: dashboard
        run: npm test -- --watchAll=false

      - name: Trigger the Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          test -n "$HOOK" || { echo "::error::secret VERCEL_DEPLOY_HOOK is missing"; exit 1; }
          curl -fsS -m 30 -X POST "$HOOK" -o /dev/null -w 'deploy hook HTTP %{http_code}\n'

      - name: Telegram alert on failure
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -m 20 "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="$TELEGRAM_CHAT_ID" -d parse_mode=HTML \
            --data-urlencode "text=🔴 <b>Dashboard deploy did not start</b>
          The tests or the deploy hook failed, so the dashboard is still on the previous version.
          <blockquote><i>financial-telegram-bot · ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}</i></blockquote>" >/dev/null
