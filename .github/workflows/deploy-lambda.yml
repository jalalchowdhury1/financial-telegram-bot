name: Deploy to AWS Lambda

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys. Two pushes landing close together used to trigger two
# deploy runs that both called update-function-code at the same instant, and
# Lambda rejects concurrent updates with ResourceConflictException. This makes
# the second run wait for the first to finish instead of racing it.
# cancel-in-progress: false → never abort an in-flight deploy; queue behind it.
concurrency:
  group: deploy-lambda-financial-telegram-report
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build deployment package
        run: |
          rm -rf package deployment_full.zip
          mkdir -p package

          # Install dependencies with manylinux wheels for Lambda
          pip install \
            --platform manylinux2014_x86_64 \
            --target=package \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: \
            -r aws/requirements-lambda.txt

          # Package dependencies
          cd package
          zip -r ../deployment_full.zip . -q
          cd ..

          # Add application code
          zip -g deployment_full.zip lambda_handler.py bot/*.py

          # Verify size
          ls -lh deployment_full.zip

      - name: Deploy to AWS Lambda
        run: |
          set -euo pipefail

          # Upload to S3 (deployment packages over ~50MB must use S3)
          BUCKET="financial-telegram-bot-deployments"
          FUNCTION="financial-telegram-report"
          REGION="us-east-1"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          S3_KEY="lambda-deployments/deployment_${TIMESTAMP}.zip"

          aws s3 cp deployment_full.zip "s3://${BUCKET}/${S3_KEY}"

          # Make sure no other update (manual console deploy, an overlapping run)
          # is still settling before we start. Non-fatal if it returns quickly.
          echo "Waiting for function to be idle before update..."
          aws lambda wait function-updated --function-name "$FUNCTION" --region "$REGION" || true

          # Update the function code, retrying on the ResourceConflictException
          # that occurs if another update sneaks in just ahead of us.
          for attempt in 1 2 3 4 5; do
            if aws lambda update-function-code \
                 --function-name "$FUNCTION" \
                 --s3-bucket "$BUCKET" \
                 --s3-key "$S3_KEY" \
                 --region "$REGION" >/dev/null; then
              echo "update-function-code accepted (attempt $attempt)."
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "update-function-code still conflicting after 5 attempts." >&2
              exit 1
            fi
            echo "Another update is in progress; waiting for it to settle, then retry $attempt..."
            aws lambda wait function-updated --function-name "$FUNCTION" --region "$REGION" || sleep 15
          done

          # Wait for our update to finish applying.
          aws lambda wait function-updated --function-name "$FUNCTION" --region "$REGION"

          echo "✓ Deployed to Lambda from S3"

        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Smoke test endpoints
        run: |
          # Get Lambda URL
          LAMBDA_URL=$(aws lambda get-function-url-config \
            --function-name financial-telegram-report \
            --region us-east-1 \
            --query 'FunctionUrl' \
            --output text)

          echo "Testing endpoints at: $LAMBDA_URL"

          # Test polymarket endpoint
          curl -X POST "$LAMBDA_URL" \
            -H "Content-Type: application/json" \
            -d '{"rawPath": "/api/polymarket", "requestContext": {"http": {"method": "GET"}}}' \
            || echo "⚠ Polymarket endpoint test failed"

          echo "✓ Smoke tests completed"

        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
