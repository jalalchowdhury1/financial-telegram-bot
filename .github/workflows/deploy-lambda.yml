name: Deploy to AWS Lambda

on:
  push:
    branches: [main]
    # Only deploy when something that actually ships to Lambda changes. This
    # stops unrelated commits (docs, dashboard, other workflows) from triggering
    # a redundant deploy — which is exactly what caused the overlapping-deploy
    # race that started this whole effort.
    paths:
      - 'lambda_handler.py'
      - 'bot/**'
      - 'aws/requirements-lambda.txt'
      - '.github/workflows/deploy-lambda.yml'
  workflow_dispatch:

# Serialize deploys. Two pushes landing close together used to trigger two
# deploy runs that both called update-function-code at the same instant, and
# Lambda rejects concurrent updates with ResourceConflictException. This makes
# the second run wait for the first to finish instead of racing it.
# cancel-in-progress: false → never abort an in-flight deploy; queue behind it.
concurrency:
  group: deploy-lambda-financial-telegram-report
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Build deployment package
        run: |
          rm -rf package deployment_full.zip
          mkdir -p package

          # Install dependencies with manylinux wheels for Lambda
          pip install \
            --platform manylinux2014_x86_64 \
            --target=package \
            --implementation cp \
            --python-version 3.11 \
            --only-binary=:all: \
            -r aws/requirements-lambda.txt

          # Package dependencies
          cd package
          zip -r ../deployment_full.zip . -q
          cd ..

          # Add application code
          zip -g deployment_full.zip lambda_handler.py bot/*.py

          # Verify size
          ls -lh deployment_full.zip

      - name: Deploy to AWS Lambda
        run: |
          set -euo pipefail

          # Upload to S3 (deployment packages over ~50MB must use S3)
          BUCKET="financial-telegram-bot-deployments"
          FUNCTION="financial-telegram-report"
          REGION="us-east-1"
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          S3_KEY="lambda-deployments/deployment_${TIMESTAMP}.zip"

          aws s3 cp deployment_full.zip "s3://${BUCKET}/${S3_KEY}"

          # Make sure no other update (manual console deploy, an overlapping run)
          # is still settling before we start. Non-fatal if it returns quickly.
          echo "Waiting for function to be idle before update..."
          aws lambda wait function-updated --function-name "$FUNCTION" --region "$REGION" || true

          # Update the function code, retrying on the ResourceConflictException
          # that occurs if another update sneaks in just ahead of us.
          for attempt in 1 2 3 4 5; do
            if aws lambda update-function-code \
                 --function-name "$FUNCTION" \
                 --s3-bucket "$BUCKET" \
                 --s3-key "$S3_KEY" \
                 --region "$REGION" >/dev/null; then
              echo "update-function-code accepted (attempt $attempt)."
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "update-function-code still conflicting after 5 attempts." >&2
              exit 1
            fi
            echo "Another update is in progress; waiting for it to settle, then retry $attempt..."
            aws lambda wait function-updated --function-name "$FUNCTION" --region "$REGION" || sleep 15
          done

          # Wait for our update to finish applying.
          aws lambda wait function-updated --function-name "$FUNCTION" --region "$REGION"

          echo "✓ Deployed to Lambda from S3"

        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1

      - name: Smoke test live endpoints (via API Gateway — the dashboard's real path)
        run: |
          set -uo pipefail
          REGION=us-east-1
          FUNCTION=financial-telegram-report

          # The dashboard reaches the Lambda through an HTTP API Gateway, NOT the
          # Function URL (which is account-blocked). Discover the HTTP APIs that
          # route to this function and test the ones that actually answer.
          mapfile -t ENDPOINTS < <(aws apigatewayv2 get-apis --region "$REGION" \
            --query 'Items[].ApiEndpoint' --output text 2>/dev/null | tr '\t' '\n' | sed '/^$/d')

          tested=0
          hard_fail=0
          for base in "${ENDPOINTS[@]}"; do
            code=$(curl -s -m 30 -o /tmp/smoke.json -w "%{http_code}" "$base/api/spy")
            # Only the gateway(s) wired to our Lambda return 200 with SPY JSON; skip the rest.
            [ "$code" = "200" ] || continue
            tested=$((tested + 1))
            echo "✓ $base/api/spy -> 200 ($(wc -c </tmp/smoke.json | tr -d ' ') bytes)"

            # Guard README risk #1: a raw NaN/Infinity in the payload crashes the
            # API Gateway proxy parser and any JS client. This is a real regression
            # signal, so fail the deploy if we ever see it.
            if grep -qE '\bNaN\b|\bInfinity\b' /tmp/smoke.json; then
              echo "::error::Unsanitized NaN/Infinity found in $base/api/spy payload (would 500 the gateway)"
              hard_fail=1
            fi
            if ! python3 -c "import json,sys; json.load(open('/tmp/smoke.json'))" 2>/dev/null; then
              echo "::error::$base/api/spy did not return valid JSON"
              hard_fail=1
            fi
          done

          if [ "$tested" -eq 0 ]; then
            echo "::warning::No API Gateway returned 200 for /api/spy — could not smoke-test the live path (deploy of code still succeeded)."
          else
            echo "Smoke-tested $tested live gateway endpoint(s)."
          fi
          exit $hard_fail

        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
