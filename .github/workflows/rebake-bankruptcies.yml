# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: Rebake Bankruptcies History

# The Four Horsemen card's 4th line has no FRED series. Its deepest layer is a
# BAKED file (dashboard/lib/data/bankruptciesBaked.json) committed to the repo,
# which until now was only ever regenerated by hand. That made it the one tier
# in the whole dashboard that could rot silently: if uscourts.gov changed or
# broke, the live tier would quietly fall back to a bake that stopped growing,
# and the card would keep showing a confident-looking number for the ~150 days
# it takes BANKRUPTCY_FRESHNESS_DAYS to notice.
#
# AOUSC publishes F-2 quarterly, ~4-6 weeks after each quarter closes, so a
# monthly run always lands shortly after a new print without hammering them.
#
# The script REFUSES to write a bake smaller than the existing one (a degraded
# uscourts must never gut years of history) and exits non-zero if it tries, so a
# real upstream break surfaces as a failed job + Telegram alert instead of a
# silently shrunken chart.

on:
  schedule:
    - cron: '0 11 8 * *'    # 8th of each month, 11:00 UTC — after the ~6wk lag
  workflow_dispatch:         # owner's on-demand override

permissions:
  contents: write            # push a branch (NOT main — branch protection blocks that)
  pull-requests: write       # open the PR for review

concurrency:
  group: rebake-bankruptcies
  cancel-in-progress: false

jobs:
  rebake:
    runs-on: ubuntu-latest
    timeout-minutes: 45      # ~100 quarters x (fetch + 2s politeness sleep)
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests 'xlrd==2.0.1'

      - name: Rebuild the baked history
        id: rebake
        continue-on-error: true    # handled explicitly below so we always notify
        run: python scripts/build_bankruptcies_history.py

      # ONE step: do the git/PR work AND notify. These used to be two steps — the
      # PR step wrote MSG to $GITHUB_ENV and a second step ran `if: env.MSG != ''`.
      # That could not fire in the failure it exists to catch: under `set -uo
      # pipefail` + GitHub's default `bash -e`, a failing `gh pr create` (or `git
      # push`) propagated its exit code out of the ASSIGNMENT and killed the step
      # BEFORE the `echo "MSG=..."`, so the notify step saw an empty MSG and was
      # skipped. Net: branch pushed, no PR, NO TELEGRAM — while this workflow's
      # whole contract is "silence is the healthy state", i.e. silence would have
      # read as success. This is the same bug that killed self-improve.yml on
      # 2026-08-05 (run 31019492456, the "Allow GitHub Actions to create and
      # approve pull requests" repo setting was OFF); the pattern below is ported
      # from that workflow's fix. The branch is already pushed by the time PR
      # creation runs, so the work is never lost — THE NOTIFY MATTERS MORE THAN
      # THE EXIT CODE.
      - name: Open a PR if the bake grew, then notify Telegram
        id: pr
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          BAKE=dashboard/lib/data/bankruptciesBaked.json
          MSG=""

          # Test against success, not against "failure": `continue-on-error` makes a
          # broken rebuild look non-fatal, and a step SKIPPED because something
          # earlier died is not healthy either.
          if [ "${{ steps.rebake.outcome }}" != "success" ]; then
            # Either the script refused to shrink the file, or uscourts is down.
            # Either way the committed bake is untouched and the card is fine.
            MSG="🔴 Bankruptcies rebake did not complete (outcome: ${{ steps.rebake.outcome }}) — the baked history was left untouched (the card still works, but the 4th horseman may be going stale). Check the Actions log."
          elif [ -z "$(git status --porcelain -- $BAKE)" ]; then
            MSG=""   # no new quarter — stay silent, that is the healthy state
          else
            QUARTERS=$(python -c "import json;print(len(json.load(open('$BAKE'))))")
            BRANCH="rebake/bankruptcies-${{ github.run_id }}"
            COMPARE="${{ github.server_url }}/${{ github.repository }}/compare/${BRANCH}?expand=1"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git checkout -b "$BRANCH"
            git add "$BAKE"
            git commit -m "chore(data): refresh baked bankruptcies history (${QUARTERS} quarters)"
            if ! PUSH_OUT=$(git push origin "$BRANCH" 2>&1); then
              echo "::warning::git push failed; no branch and no PR."
              printf '%s\n' "$PUSH_OUT"
              MSG="⚠️ Bankruptcies rebake found ${QUARTERS} quarters but COULD NOT PUSH the branch — no PR was opened. Check the Actions log; main is untouched."
            elif PR_OUT=$(gh pr create --base main --head "$BRANCH" \
              --title "chore(data): refresh baked bankruptcies history" \
              --body "Automated monthly rebake of the Four Horsemen bankruptcies fallback: **${QUARTERS} quarters**. The script refuses to shrink the file, so this only ever adds or corrects quarters." 2>&1); then
              URL=$(printf '%s\n' "$PR_OUT" | tail -1)
              MSG="🐎 Bankruptcies rebake: new quarter(s) available (${QUARTERS} total) — PR opened: ${URL}"
            else
              # Surface the real reason in the job log instead of swallowing it into $URL.
              # First thing to check: Settings ▸ Actions ▸ General ▸ "Allow GitHub Actions
              # to create and approve pull requests".
              echo "::warning::gh pr create failed; branch is pushed, open the PR by hand."
              printf '%s\n' "$PR_OUT"
              MSG="⚠️ Bankruptcies rebake pushed \`${BRANCH}\` (${QUARTERS} quarters) but COULD NOT open the PR. Open it here: ${COMPARE}"
            fi
          fi

          if [ -n "$MSG" ]; then
            export MSG
            python - <<'PY'
          import os
          from bot.utils import send_to_telegram
          send_to_telegram(os.environ['TELEGRAM_TOKEN'], os.environ['TELEGRAM_CHAT_ID'], caption=os.environ['MSG'])
          PY
          fi
