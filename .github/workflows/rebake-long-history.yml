# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: Rebake Long History

# The tap-a-number popovers draw decades of baked history (dashboard/public/history/)
# BEFORE the history sheet's points. /api/history carries at most 730 days of sheet
# (CHART_MAX_DAYS), so a bake that is never refreshed opens a hole in every chart once
# the sheet window starts after the bake's last day (~2 years after the bake). This
# re-bakes every quarter, so there are always ~7 more runs before a hole could open.
#
# scripts/bake_long_history.py refuses any stat that disagrees with the sheet, starts
# later, or shrinks below 90% of its file; a refused or unreachable stat keeps its old
# file and the others are still refreshed (exit 1 = "some stats failed", not "nothing
# written"). The PR self-merges once CI is green, exactly like rebake-bankruptcies.yml
# (owner OK'd self-merge for this one on 2026-10-10), and deploy-dashboard.yml deploys
# after a SUCCESSFUL run that moved main, so only a merge costs a Vercel deploy.
#
# The owner hears from it only when he must act (his ask, 2026-10-11), and the run is red
# exactly then. Silent and green: merged, even when a stat kept its old bake (that file
# still draws a full chart for ~2 years and next quarter retries it; the PR body lists
# it), or nothing new to ship (a same-day re-run). 🟡, still green: a chart would show a
# gap within a year (the bake's RUNWAY LOW line). 🔴 and red: the bake died or baked
# nothing, or its PR could not be merged. GitHub blips get three tries first.
# tests/test_rebake_long_history_workflow.py runs the notify step for every one of those.
#
# A PR that changes this file or the bake script dry-runs the bake here: proof the
# sources answer from GitHub's runners, nothing written.

on:
  schedule:
    - cron: '0 12 15 1,4,7,10 *'   # 15 Jan / Apr / Jul / Oct, 12:00 UTC
  workflow_dispatch:                # owner's on-demand re-bake
  pull_request:
    paths:
      - '.github/workflows/rebake-long-history.yml'
      - 'dashboard/scripts/bake_long_history.py'

permissions:
  contents: write            # push a branch (NOT main — branch protection blocks that)
  pull-requests: write       # open + merge the PR (owner OK'd self-merge 10 Oct 2026)
  actions: write             # dispatch CI on the bot branch (see ci.yml)

concurrency:
  group: rebake-long-history
  cancel-in-progress: false

jobs:
  rebake:
    runs-on: ubuntu-latest
    timeout-minutes: 120       # bake ≤ 50 min (its own cap), + CI wait up to 40 min, + retries
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install 'xlrd==2.0.1'

      - name: Dry run (pull request — nothing written)
        if: github.event_name == 'pull_request'
        working-directory: dashboard
        run: python scripts/bake_long_history.py --dry --retry-after=120

      - name: Re-bake
        id: bake
        if: github.event_name != 'pull_request'
        continue-on-error: true      # some stats refused ≠ nothing to ship; handled below
        timeout-minutes: 50          # ~1 min normally; a hung source must leave time to notify
        working-directory: dashboard
        run: |
          set -o pipefail
          # a stat whose source failed gets one more try 20 min later (a source can be down for minutes)
          python scripts/bake_long_history.py --retry-after=1200 2>&1 | tee "$RUNNER_TEMP/bake.log"

      # One step does the git/PR work AND the notify, for the reason spelled out in
      # rebake-bankruptcies.yml: a failing assignment under bash -e used to kill the
      # step before the message was set, and silence read as success.
      - name: Open a PR, self-merge on green CI, notify only when the owner must act
        if: always() && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMPARE_URL: ${{ github.server_url }}/${{ github.repository }}/compare/rebake/long-history-${{ github.run_id }}?expand=1
        run: |
          set -uo pipefail
          LOG="$RUNNER_TEMP/bake.log"
          FAILED=$(grep -o 'FAILED/REFUSED: .*' "$LOG" 2>/dev/null | head -1 || true)
          LOW=$(grep -o 'RUNWAY LOW: .*' "$LOG" 2>/dev/null | head -1 || true)
          MSG=""; OK=""

          if ! grep -qE '^(wrote |dry run)' "$LOG" 2>/dev/null; then
            # Died before its summary (a crash, or the sheet unreachable for minutes): files
            # it wrote are not shipped without the index that describes them.
            MSG="🔴 <b>Long-history rebake stopped before it finished</b> (bake: ${{ steps.bake.outcome }}); nothing shipped, charts keep the old bake. Log: ${RUN_URL}"
          # Judge on the stat files: the index's bakedAt changes on every run, even one
          # where every stat failed.
          elif [ -z "$(git status --porcelain -- dashboard/public/history)" ]; then
            if grep -q '^NOTHING BAKED' "$LOG"; then
              MSG="🔴 <b>Long-history rebake baked nothing</b>: every stat failed (${FAILED#FAILED/REFUSED: }). Charts keep the old bake. Log: ${RUN_URL}"
            else
              OK=1      # every stat that baked matched its committed file (a same-day re-run)
              if [ -n "$LOW" ]; then
                MSG="🟡 <b>Long-history rebake had nothing new, and a chart needs a new source within a year</b>: ${LOW#RUNWAY LOW: }. Log: ${RUN_URL}"
              fi
            fi
          else
            N=$(python -c "import json;print(len(json.load(open('dashboard/lib/data/longHistoryIndex.json'))['keys']))" 2>/dev/null || echo '?')
            BRANCH="rebake/long-history-${{ github.run_id }}"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git checkout -b "$BRANCH"
            git add dashboard/public/history dashboard/lib/data/longHistoryIndex.json
            git commit -m "chore(data): refresh baked long history (${N} stats)"
            # Every GitHub call below gets three tries: a blip must not strand a good bake.
            PUSHED=""; URL=""; MERGED=""; CHECKS=""
            for _ in 1 2 3; do
              if PUSH_OUT=$(git push origin "$BRANCH" 2>&1); then PUSHED=1; break; fi
              printf '%s\n' "$PUSH_OUT"
              sleep 15
            done
            if [ -z "$PUSHED" ]; then
              MSG="🔴 <b>Long-history rebake could not push its branch</b>; main untouched. Log: ${RUN_URL}"
            else
              for _ in 1 2 3; do
                if PR_OUT=$(gh pr create --base main --head "$BRANCH" \
                    --title "chore(data): refresh baked long history" \
                    --body "Quarterly re-bake of the popovers' long history (${N} stats). ${FAILED:-Every stat refreshed.} A stat that failed keeps its old file, which still draws a full chart for ~2 years. The bake refuses any stat that disagrees with the sheet, starts later, or shrinks." 2>&1); then
                  URL=$(printf '%s\n' "$PR_OUT" | tail -1)
                  break
                fi
                printf '%s\n' "$PR_OUT"
                URL=$(gh pr view "$BRANCH" --json url --jq .url 2>/dev/null || true)   # opened despite the error?
                if [ -n "$URL" ]; then break; fi
                sleep 15
              done
              if [ -z "$URL" ]; then
                MSG="🔴 <b>Long-history rebake pushed ${BRANCH} but could not open the PR</b>. Open it: ${COMPARE_URL}"
              else
                for _ in 1 2 3; do
                  if gh workflow run ci.yml --ref "$BRANCH"; then
                    for _ in $(seq 1 120); do      # up to ~40 min
                      sleep 20
                      CHECKS=$(gh pr checks "$BRANCH" --required 2>/dev/null || true)
                      if printf '%s\n' "$CHECKS" | grep -qE $'\t(fail|cancel)'; then break; fi
                      if printf '%s\n' "$CHECKS" | grep -qE $'^backend-tests\tpass' &&
                         printf '%s\n' "$CHECKS" | grep -qE $'^dashboard-tests\tpass'; then
                        for _ in 1 2 3; do       # a just-green PR can briefly read as not mergeable
                          gh pr merge "$BRANCH" --squash --delete-branch || true
                          if [ "$(gh pr view "$URL" --json state --jq .state 2>/dev/null || true)" = MERGED ]; then
                            MERGED=1
                            break
                          fi
                          sleep 15
                        done
                        break
                      fi
                    done
                    break
                  fi
                  sleep 15
                done
                if [ -z "$MERGED" ]; then
                  printf '%s\n' "${CHECKS:-no checks seen}"
                  MSG="🔴 <b>Long-history rebake: PR opened but NOT merged</b> (CI red, or not green within 40 min). Review: ${URL}"
                else
                  OK=1
                  if [ -n "$LOW" ]; then
                    MSG="🟡 <b>Long-history rebake merged, but a chart needs a new source within a year</b>: ${LOW#RUNWAY LOW: }. Log: ${RUN_URL}"
                  fi
                fi
              fi
            fi
          fi

          # Silence = nothing for the owner to do. Anything else pings once.
          if [ -n "$MSG" ]; then
            curl -sS -m 20 "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
              -d chat_id="$TELEGRAM_CHAT_ID" -d parse_mode=HTML \
              --data-urlencode "text=$MSG" -o /dev/null -w 'telegram HTTP %{http_code}\n' || true
          fi
          # Red = he must act. Green costs no deploy unless this run merged: deploy-dashboard.yml
          # deploys a rebake only when main moved.
          [ -n "$OK" ]
