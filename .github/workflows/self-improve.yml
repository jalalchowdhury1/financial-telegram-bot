# yaml-language-server: $schema=https://json.schemastore.org/github-workflow
name: Weekly Self-Improve

on:
  schedule:
    - cron: '0 13 * * 3'   # Wednesday 13:00 UTC (~9 ET)
  workflow_dispatch:        # owner's on-demand override

permissions:
  contents: write           # create a feature branch (NOT main — branch protection blocks that)
  pull-requests: write      # open the PR
  actions: read             # download recent health-check artifacts (the health history)

concurrency:
  group: self-improve
  cancel-in-progress: false

jobs:
  self-improve:
    runs-on: ubuntu-latest
    timeout-minutes: 30      # hard wall-clock backstop
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Install deps + Claude CLI
        run: |
          pip install -r requirements-dev.txt
          npm install -g @anthropic-ai/claude-code

      - name: Pull recent health reports (durable history = health-check run artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          mkdir -p health/history
          for rid in $(gh run list --workflow health-check.yml --status success --limit 10 --json databaseId --jq '.[].databaseId'); do
            gh run download "$rid" -n health-report -D "/tmp/hr-$rid" 2>/dev/null || continue
            [ -f "/tmp/hr-$rid/health-report.json" ] && cp "/tmp/hr-$rid/health-report.json" "health/history/$rid.json"
          done
          echo "Collected $(ls health/history 2>/dev/null | wc -l) recent health report(s)."

      - name: Build the health digest
        run: python scripts/collect_health_context.py

      - name: Run the self-improve agent (headless Claude CLI; edits files only)
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -uo pipefail
          PROMPT="$(cat .github/self-improve-prompt.md)

          ===== This week's health digest (health-digest.md) =====
          $(cat health-digest.md)"
          claude -p "$PROMPT" \
            --model claude-opus-4-8 \
            --max-turns 15 \
            --allowedTools "Read,Edit,Write,Grep,Glob" \
            --permission-mode acceptEdits \
            --output-format text

      - name: Open a PR if the agent changed anything, then summarize to Telegram
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -uo pipefail
          # Drop ephemeral run artifacts so they don't show up as "changes".
          rm -f health-digest.md; rm -rf health/history

          if [ "${{ steps.agent.outcome }}" = "failure" ]; then
            export MSG="🔴 Weekly self-improve FAILED to run — check the Actions log (no PR opened)."
          elif [ -z "$(git status --porcelain)" ]; then
            export MSG="🛠️ Weekly self-improve: nothing to fix this week. ✅"
          else
            python -m pytest tests/ -q && TESTS="✅ pass" || TESTS="🔴 FAIL"
            BRANCH="self-improve/run-${{ github.run_id }}"
            git config user.name "claude-self-improve"
            git config user.email "actions@github.com"
            git checkout -b "$BRANCH"
            git add -A
            # NO `[skip ci]` here. ci.yml triggers ONLY on `pull_request` to main, and
            # deploy-lambda.yml only on push to main — so on a feature-branch push the
            # marker suppressed nothing, while on the PR it suppressed `backend-tests` +
            # `dashboard-tests`, which are REQUIRED checks on main. The agent's PR was
            # therefore unmergeable by design (seen on #38), and the marker riding into
            # a merge commit would also skip the Lambda deploy.
            git commit -m "self-improve: automated change (review before merge)"
            git push origin "$BRANCH"
            # NEVER let a PR-create failure kill this step: the branch is already
            # pushed, so the work is safe, and the Telegram summary below is the
            # only thing that tells the owner anything happened. `set -e` + the
            # old `URL=$(gh pr create ... 2>&1 | tail -1)` did the opposite —
            # pipefail propagated gh's exit code out of the assignment, aborting
            # before the notify, and gh's error text vanished into $URL.
            # (2026-08-05: that is exactly how run 31019492456 died, silently.)
            COMPARE="${{ github.server_url }}/${{ github.repository }}/compare/${BRANCH}?expand=1"
            if PR_OUT=$(gh pr create --base main --head "$BRANCH" \
              --title "Weekly self-improve: automated change" \
              --body "Opened by the weekly self-improve agent (headless). Backend tests: ${TESTS}. Review before merging." 2>&1); then
              URL=$(printf '%s\n' "$PR_OUT" | tail -1)
              export MSG="🛠️ Weekly self-improve opened a PR for review: ${URL} (backend tests: ${TESTS})"
            else
              # Surface the real reason in the job log instead of swallowing it.
              echo "::warning::gh pr create failed; branch is pushed, open the PR by hand."
              printf '%s\n' "$PR_OUT"
              export MSG="⚠️ Weekly self-improve pushed \`${BRANCH}\` but COULD NOT open the PR (backend tests: ${TESTS}). Open it here: ${COMPARE}"
            fi
          fi

          python - <<'PY'
          import os
          from bot.utils import send_to_telegram
          send_to_telegram(os.environ['TELEGRAM_TOKEN'], os.environ['TELEGRAM_CHAT_ID'], caption=os.environ['MSG'])
          PY
